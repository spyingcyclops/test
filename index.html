<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OEMpire Panel</title>

  <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .panel {
      padding: 12px;
      border: 1px solid #579dff;
      border-radius: 4px;
      background: #e9f2ff;
      color: #172b4d;
    }
  </style>
</head>

<body>
  <div class="panel">
    <strong>OEMpire proof of concept</strong>
    <div id="result">Waiting for Confluence context…</div>
  </div>

  <script>
  const result = document.getElementById("result");
  let displayedPageId = null;

  function renderContext(context) {
    const pageId = context?.pageId || context?.contentId;
    const space = context?.spaceKey || context?.entityKey || context?.spaceId;

    if (!pageId) {
      result.textContent = "Current page context is unavailable.";
      return;
    }

    if (pageId === displayedPageId) {
      return;
    }

    displayedPageId = pageId;
    result.textContent =
      `Page ID: ${pageId}; Space: ${space || "unknown"}`;
  }

  function refreshContext() {
    if (window.AP?.context?.getContext) {
      AP.context.getContext(function (context) {
        renderContext(context);
      });
      return;
    }

    renderContext(window.AdaptavistBridgeContext?.context);
  }

  window.addEventListener("load", function () {
    refreshContext();

    // Confluence changes pages without necessarily reloading this iframe.
    window.setInterval(refreshContext, 1000);
  });
</script>
</body>
</html>
