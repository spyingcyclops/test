<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OEMpire Panel</title>

  <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .panel {
      padding: 12px;
      border: 1px solid #579dff;
      border-radius: 4px;
      background: #e9f2ff;
      color: #172b4d;
    }
  </style>
</head>

<body>
  <div class="panel">
    <strong>OEMpire proof of concept</strong>
    <div id="result">Waiting for Confluence context…</div>
  </div>

 <script>
  const result = document.getElementById("result");
  let displayedPageId = null;

  function renderLocation(location) {
    const context = location?.context || {};
    const pageId = context.contentId;
    const space = context.spaceKey;

    if (!pageId) {
      result.textContent = "The current page could not be identified.";
      return;
    }

    if (pageId === displayedPageId) {
      return;
    }

    displayedPageId = pageId;

    result.textContent =
      `Page ID: ${pageId}; Space: ${space || "unknown"}`;
  }

  function refreshLocation() {
    if (!window.AP?.navigator?.getLocation) {
      result.textContent = "The Confluence Navigator API is unavailable.";
      return;
    }

    AP.navigator.getLocation(function (location) {
      renderLocation(location);
    });
  }

  window.addEventListener("load", function () {
    refreshLocation();

    // Detect Confluence single-page navigation.
    window.setInterval(refreshLocation, 1000);
  });
</script>
</body>
</html>
