<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OEMpire Panel</title>

  <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .panel {
      padding: 12px;
      border: 1px solid #579dff;
      border-radius: 4px;
      background: #e9f2ff;
      color: #172b4d;
    }
  </style>
</head>

<body>
  <div class="panel">
    <strong>OEMpire proof of concept</strong>
    <div id="result">Waiting for Confluence context…</div>
  </div>

  <script>
  const result = document.getElementById("result");
  let attempts = 0;

  function readContext() {
    attempts += 1;

    const bridgeContext = window.AdaptavistBridgeContext;
    const context = bridgeContext?.context;

    if (context && (context.pageId || context.contentId)) {
      result.textContent =
        `Page ID: ${context.pageId || context.contentId}; ` +
        `Space: ${context.entityKey || context.spaceId || "unknown"}`;
      return;
    }

    if (attempts < 20) {
      setTimeout(readContext, 250);
      return;
    }

    result.innerHTML = `
      <div>Context was not populated.</div>
      <pre style="white-space:pre-wrap">${escapeHtml(
        JSON.stringify(bridgeContext, null, 2)
      )}</pre>
    `;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;");
  }

  window.addEventListener("load", readContext);
</script>
</body>
</html>
